apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-config
  namespace: temporal
data:
  DB: postgres12
  DB_PORT: "5432"
  POSTGRES_SEEDS: postgres.temporal.svc.cluster.local
  DBNAME: temporal
  VISIBILITY_DBNAME: temporal_visibility
  DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
  ENABLE_ES: "true"
  ES_SEEDS: elasticsearch.temporal.svc.cluster.local
  ES_VERSION: v7
  ES_VIS_INDEX: temporal_visibility_v1_dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-server
  namespace: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-server
  template:
    metadata:
      labels:
        app: temporal-server
    spec:
      # auto-setup runs its own DB/schema setup on start, so postgres + ES
      # need to already be reachable before this pod comes up
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - >
              until pg_isready -h postgres.temporal.svc.cluster.local -p 5432;
              do echo waiting for postgres; sleep 2; done
        - name: wait-for-elasticsearch
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until wget -q -O- http://elasticsearch.temporal.svc.cluster.local:9200/_cluster/health;
              do echo waiting for elasticsearch; sleep 2; done
      containers:
        - name: temporal-server
          image: temporalio/auto-setup:1.29.1
          envFrom:
            - configMapRef:
                name: temporal-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          ports:
            - name: frontend
              containerPort: 7233
            - name: history
              containerPort: 7234
            - name: matching
              containerPort: 7235
            - name: worker
              containerPort: 7239
            - name: membership
              containerPort: 6933
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: temporal
  labels:
    app: temporal-server
spec:
  selector:
    app: temporal-server
  ports:
    - name: frontend
      port: 7233
      targetPort: 7233
